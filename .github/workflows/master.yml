name: Master branch PR merge pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  prepare:
    name: Prepare
    uses: amb-code/amb-ci-tools/.github/workflows/prepare-env.yml@v1.2.0
    secrets: inherit

  build:
    name: Build
    uses: amb-code/amb-ci-tools/.github/workflows/build-python.yml@v1.2.0
    secrets: inherit

    needs: [ prepare ]

    with:
      stage-name: ${{ needs.prepare.outputs.stage-name }}
      env-name: staging

  release:
    name: Release
    uses: amb-code/amb-ci-tools/.github/workflows/release.yml@v1.2.0
    secrets: inherit

    needs: [ prepare, build ]

    permissions:
      contents: write
      pull-requests: write

    with:
      stage-name: ${{ needs.prepare.outputs.stage-name }}
      env-name: production
      docker: true
      docker-image: amb-public/amb-feedback-bot

  approve-deploy-production:
    name: Approve Deploy Production
    runs-on: ubuntu-latest
    environment: manual-approval

    needs: [ release ]

    steps:
      - name: Deploy Approval
        run: echo "Approve to deploy"

  deploy-production:
    name: Deploy Production
    uses: amb-code/amb-ci-tools/.github/workflows/deploy-ansible.yml@v1.2.0
    secrets: inherit

    needs: [ prepare, release, approve-deploy-production ]

    with:
      stage-name: ${{ needs.prepare.outputs.stage-name }}
      env-name: production
      target-server: ${{ vars.TARGET_SERVER }}
      tag: ${{ needs.release.outputs.new_version }}
